{{- if not .Values.admin.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-admin" (include "valtimo-mcp-gateway.fullname" .) }}
  labels:
    {{- include "valtimo-mcp-gateway.labels" . | nindent 4 }}
type: Opaque
data:
  admin-username: {{ .Values.admin.username | b64enc | quote }}
  admin-password: {{ required "admin.password is required when admin.existingSecret is not set" .Values.admin.password | b64enc | quote }}
{{- end }}
---
{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-db" (include "valtimo-mcp-gateway.fullname" .) }}
  labels:
    {{- include "valtimo-mcp-gateway.labels" . | nindent 4 }}
type: Opaque
data:
  db-password: {{ required "database.password is required when database.existingSecret is not set" .Values.database.password | b64enc | quote }}
{{- end }}
